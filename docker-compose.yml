version: '3.8'

services:
  # قاعدة البيانات PostgreSQL
  postgres:
    image: postgres:15-alpine
    container_name: h-hr-postgres
    environment:
      POSTGRES_USER: h_hr_user
      POSTGRES_PASSWORD: SecurePassword123!
      POSTGRES_DB: h_hr_db
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "5432:5432"
    volumes:
      # حفظ البيانات في مجلد persistent
      - postgres_data:/var/lib/postgresql/data
      # استيراد الـ schema تلقائياً
      - ./schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U h_hr_user -d h_hr_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - h-hr-network

  # الخادم Node.js
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: h-hr-app
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://h_hr_user:SecurePassword123!@postgres:5432/h_hr_db
      ALLOWED_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      DEFAULT_COMPANY_NAME: Mura
      DEFAULT_ADMIN_USERNAME: admin
      DEFAULT_ADMIN_PASSWORD: Admin@123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      # مراقبة التغييرات على الملفات
      - ./server.js:/app/server.js
      - ./database.js:/app/database.js
      - ./index.html:/app/public/index.html
      - node_modules:/app/node_modules
    restart: unless-stopped
    networks:
      - h-hr-network

  # (اختياري) Adminer لإدارة قاعدة البيانات
  adminer:
    image: adminer:latest
    container_name: h-hr-adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - h-hr-network

volumes:
  postgres_data:
    driver: local
  node_modules:

networks:
  h-hr-network:
    driver: bridge
