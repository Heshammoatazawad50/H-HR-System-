<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>H-HR | نظام الموارد البشرية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;600;700;800;900&family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F7F3EC; --surface:#FFFFFF; --surface-alt:#F0E9DC;
  --ink:#241F1B; --ink-soft:#786D5F;
  --sidebar-bg:#1C1613; --sidebar-bg2:#241C17; --sidebar-ink:#EFE6D8; --sidebar-ink-dim:#B4A691;
  --accent:#C89B3C; --accent-dark:#9C7A2C;
  --success:#4F7A5D; --success-bg:#E7F0E9;
  --danger:#B14D36; --danger-bg:#F7E6E1;
  --warn:#B8860B; --warn-bg:#F6EDDA;
  --info:#3E6B8A; --info-bg:#E5EEF3;
  --border:#E5DCC9; --shadow:0 10px 30px -12px rgba(28,22,17,.18); --radius:14px;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{background:var(--bg);color:var(--ink);font-family:'Tajawal',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;}
h1,h2,h3,h4,.brand,.nav-link span,.btn,.kpi-label,.section-title{font-family:'Cairo',sans-serif;}
button{font-family:inherit;} a{color:inherit;}
::selection{background:var(--accent);color:#fff;}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px;}
.hidden{display:none !important;}
.num{font-variant-numeric:tabular-nums;}

/* LOGIN */
.login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 30% 20%,#2b221b 0%,#1C1613 55%,#14100D 100%);padding:24px;}
.login-card{width:100%;max-width:400px;background:var(--surface);border-radius:20px;padding:36px 30px;box-shadow:0 30px 60px -20px rgba(0,0,0,.5);border:1px solid rgba(255,255,255,.06);}
.login-logo{width:56px;height:56px;border-radius:16px;background:linear-gradient(145deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;color:#241a0a;font-family:'Cairo';font-weight:900;font-size:19px;margin:0 auto 16px;box-shadow:0 8px 18px -6px rgba(200,155,60,.6);}
.login-title{text-align:center;font-size:22px;font-weight:800;margin:0 0 2px;}
.login-sub{text-align:center;color:var(--ink-soft);font-size:14px;margin:0 0 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:13px;font-weight:700;margin-bottom:6px;color:var(--ink-soft);}
.field input,.field select,.field textarea{width:100%;padding:12px 14px;border:1.5px solid var(--border);border-radius:10px;background:#FBF9F4;font-size:15px;color:var(--ink);font-family:inherit;transition:.15s border-color;}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);background:#fff;}
.field-row{display:flex;gap:12px;} .field-row .field{flex:1;}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:10px;border:none;cursor:pointer;font-weight:700;font-size:14.5px;transition:.15s transform,.15s box-shadow,.15s background;white-space:nowrap;}
.btn:active{transform:scale(.97);}
.btn-primary{background:var(--accent);color:#241a0a;box-shadow:0 8px 18px -8px rgba(200,155,60,.55);}
.btn-primary:hover{background:var(--accent-dark);}
.btn-block{width:100%;}
.btn-ghost{background:transparent;color:var(--ink);border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:var(--accent);}
.btn-danger{background:var(--danger-bg);color:var(--danger);}
.btn-danger:hover{background:var(--danger);color:#fff;}
.btn-success{background:var(--success-bg);color:var(--success);}
.btn-success:hover{background:var(--success);color:#fff;}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:8px;}
.login-hint{margin-top:18px;background:var(--surface-alt);border:1px dashed var(--border);border-radius:10px;padding:12px 14px;font-size:12.5px;color:var(--ink-soft);line-height:1.9;}
.login-error{color:var(--danger);font-size:13.5px;text-align:center;margin-bottom:10px;font-weight:700;min-height:0;}

/* SHELL */
.app-shell{display:flex;min-height:100vh;}
.sidebar{width:258px;flex:0 0 258px;background:linear-gradient(180deg,var(--sidebar-bg),var(--sidebar-bg2));color:var(--sidebar-ink);display:flex;flex-direction:column;position:fixed;top:0;bottom:0;right:0;z-index:40;transition:transform .25s ease;}
.sidebar-head{padding:20px 20px 14px;display:flex;align-items:center;gap:10px;border-bottom:1px solid rgba(255,255,255,.08);}
.sidebar-logo{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--accent),var(--accent-dark));display:flex;align-items:center;justify-content:center;font-weight:900;color:#241a0a;font-family:'Cairo';flex:0 0 auto;font-size:14px;}
.brand{font-weight:800;font-size:16px;line-height:1.3;} .brand small{display:block;font-weight:500;font-size:11px;color:var(--sidebar-ink-dim);}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 12px;}
.nav-section{font-size:10.5px;color:var(--sidebar-ink-dim);font-weight:700;letter-spacing:.5px;margin:12px 10px 6px;text-transform:uppercase;}
.nav-link{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:var(--sidebar-ink-dim);text-decoration:none;font-size:13.8px;font-weight:600;cursor:pointer;margin-bottom:2px;border:none;background:none;width:100%;text-align:right;}
.nav-link svg{width:18px;height:18px;flex:0 0 auto;}
.nav-link:hover{background:rgba(255,255,255,.06);color:var(--sidebar-ink);}
.nav-link.active{background:var(--accent);color:#241a0a;}
.sidebar-foot{padding:12px 12px 16px;border-top:1px solid rgba(255,255,255,.08);}
.user-chip{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);margin-bottom:8px;}
.user-avatar{width:34px;height:34px;border-radius:50%;background:var(--accent);color:#241a0a;display:flex;align-items:center;justify-content:center;font-weight:800;font-family:'Cairo';flex:0 0 auto;}
.user-meta{overflow:hidden;} .user-name{font-size:13.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;} .user-role{font-size:11px;color:var(--sidebar-ink-dim);}
.main{flex:1;margin-right:258px;display:flex;flex-direction:column;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:30;background:rgba(247,243,236,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--border);padding:13px 24px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.topbar-title{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px;}
.topbar-right{display:flex;align-items:center;gap:8px;position:relative;}
.clock-pill{background:var(--surface-alt);border:1px solid var(--border);border-radius:999px;padding:7px 14px;font-size:12.5px;font-weight:700;color:var(--ink-soft);}
.branch-pill select{border:1px solid var(--border);border-radius:999px;padding:7px 12px;background:var(--surface-alt);font-family:inherit;font-weight:700;font-size:12.5px;}
.hamburger{display:none;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:8px;cursor:pointer;}
.content{padding:22px 24px 60px;flex:1;}
.sidebar-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none;}
.sidebar-backdrop.show{display:block;}

.bell-btn{position:relative;background:var(--surface-alt);border:1px solid var(--border);border-radius:10px;padding:8px 9px;cursor:pointer;display:flex;}
.bell-btn svg{width:18px;height:18px;}
.bell-badge{position:absolute;top:-5px;left:-5px;background:var(--danger);color:#fff;font-size:10px;font-weight:800;min-width:17px;height:17px;border-radius:999px;display:flex;align-items:center;justify-content:center;padding:0 3px;}
.notif-panel{position:absolute;top:50px;left:0;width:330px;max-height:440px;overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 45px -15px rgba(0,0,0,.35);z-index:60;padding:8px;}
.notif-item{padding:10px 12px;border-radius:10px;cursor:pointer;border-bottom:1px solid var(--border);}
.notif-item:last-child{border-bottom:none;}
.notif-item:hover{background:var(--surface-alt);}
.notif-item.unread{background:#FBF3E3;}
.notif-item .t{font-weight:700;font-size:13.2px;} .notif-item .b{font-size:12px;color:var(--ink-soft);margin-top:2px;} .notif-item .d{font-size:10.5px;color:var(--ink-soft);margin-top:5px;}
.notif-empty{padding:26px 14px;text-align:center;color:var(--ink-soft);font-size:13px;}
.notif-head{display:flex;justify-content:space-between;align-items:center;padding:6px 8px 10px;}
.notif-head b{font-size:13.5px;}

/* shared */
.page-header{display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:20px;}
.page-header h2{font-size:21px;margin:0 0 4px;} .page-header p{margin:0;color:var(--ink-soft);font-size:13.5px;}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow);padding:20px;}
.kpi-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin-bottom:22px;}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:17px 19px;position:relative;overflow:hidden;box-shadow:var(--shadow);}
.kpi-card::before{content:'';position:absolute;top:0;right:0;width:5px;height:100%;background:var(--accent);}
.kpi-card.warn::before{background:var(--warn);} .kpi-card.danger::before{background:var(--danger);} .kpi-card.success::before{background:var(--success);} .kpi-card.info::before{background:var(--info);}
.kpi-label{font-size:12px;color:var(--ink-soft);font-weight:700;margin-bottom:6px;}
.kpi-value{font-size:25px;font-weight:800;} .kpi-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px;}
.section-title{font-size:15.5px;font-weight:800;margin:0 0 12px;display:flex;align-items:center;gap:8px;}
.grid-2{display:grid;grid-template-columns:1.3fr 1fr;gap:16px;} @media(max-width:900px){.grid-2{grid-template-columns:1fr;}}
table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{text-align:right;font-size:11.5px;color:var(--ink-soft);font-weight:700;padding:10px 12px;border-bottom:2px solid var(--border);white-space:nowrap;}
tbody td{padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:middle;}
tbody tr:hover{background:var(--surface-alt);}
.table-wrap{overflow-x:auto;border-radius:var(--radius);border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);}
.table-wrap table{margin:0;}
.table-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px;}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;}
.filters select,.filters input{padding:9px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);font-size:13px;font-family:inherit;}
.empty-state{padding:38px 20px;text-align:center;color:var(--ink-soft);}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:11.5px;font-weight:700;}
.badge-success{background:var(--success-bg);color:var(--success);} .badge-danger{background:var(--danger-bg);color:var(--danger);}
.badge-warn{background:var(--warn-bg);color:var(--warn);} .badge-muted{background:var(--surface-alt);color:var(--ink-soft);} .badge-info{background:var(--info-bg);color:var(--info);}
.icon-btn-row{display:flex;gap:6px;flex-wrap:wrap;}
.modal-backdrop{position:fixed;inset:0;background:rgba(20,15,10,.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--surface);border-radius:16px;max-width:540px;width:100%;max-height:88vh;overflow-y:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:18px 22px;border-bottom:1px solid var(--border);position:sticky;top:0;background:var(--surface);border-radius:16px 16px 0 0;}
.modal-header h3{margin:0;font-size:16.5px;}
.modal-close{background:var(--surface-alt);border:none;width:32px;height:32px;border-radius:9px;font-size:18px;cursor:pointer;color:var(--ink-soft);}
.modal-body{padding:20px 22px 24px;} .modal-actions{display:flex;gap:10px;margin-top:6px;flex-wrap:wrap;}
.toast-wrap{position:fixed;bottom:20px;left:20px;z-index:200;display:flex;flex-direction:column;gap:8px;max-width:90vw;}
.toast{background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-size:13.3px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;box-shadow:0 10px 25px -8px rgba(0,0,0,.4);}
.toast.show{opacity:1;transform:translateY(0);} .toast-success{background:#2f5b3f;} .toast-error{background:#7d3226;}
.clock-page-grid{display:grid;grid-template-columns:1fr 1.1fr;gap:18px;} @media(max-width:820px){.clock-page-grid{grid-template-columns:1fr;}}
.radar-card{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;}
.radar-wrap{position:relative;width:200px;height:200px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;}
.radar-ring{position:absolute;border-radius:50%;border:2px solid var(--accent);opacity:0;width:100%;height:100%;}
.radar-btn.scanning .radar-ring{animation:radarPulse 1.8s ease-out infinite;}
.radar-ring.r2{animation-delay:.5s;} .radar-ring.r3{animation-delay:1s;}
@keyframes radarPulse{0%{transform:scale(.45);opacity:.9;}100%{transform:scale(1);opacity:0;}}
.radar-btn{width:145px;height:145px;border-radius:50%;border:none;cursor:pointer;position:relative;background:radial-gradient(circle at 35% 30%,#e2b45a,var(--accent) 60%,var(--accent-dark) 100%);color:#241a0a;font-family:'Cairo';font-weight:800;font-size:14.5px;box-shadow:0 14px 30px -10px rgba(200,155,60,.6);display:flex;align-items:center;justify-content:center;padding:10px;text-align:center;line-height:1.3;}
.radar-btn:disabled{background:var(--surface-alt);color:var(--ink-soft);box-shadow:none;cursor:not-allowed;}
.radar-btn.blocked{background:radial-gradient(circle at 35% 30%,#d98a76,var(--danger) 80%);}
.radar-btn:active:not(:disabled){transform:scale(.96);}
.clock-status-line{font-size:13px;color:var(--ink-soft);margin-top:4px;max-width:260px;}
.clock-times{display:flex;gap:22px;margin-top:16px;}
.clock-time-item{text-align:center;} .clock-time-item .t{font-size:19px;font-weight:800;font-family:'Cairo';} .clock-time-item .l{font-size:11px;color:var(--ink-soft);}
@media (prefers-reduced-motion: reduce){.radar-btn.scanning .radar-ring{animation:none;opacity:.5;}}
.week-nav{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
.week-nav .label{font-weight:700;font-size:14px;background:var(--surface-alt);padding:8px 16px;border-radius:9px;}
.sched-grid{width:100%;border-collapse:collapse;}
.sched-grid th{background:var(--surface-alt);padding:9px 6px;font-size:11.5px;text-align:center;border:1px solid var(--border);}
.sched-grid td{border:1px solid var(--border);padding:6px;text-align:center;vertical-align:top;min-width:104px;}
.sched-cell{border-radius:8px;padding:8px 6px;background:var(--surface-alt);cursor:pointer;font-size:11.5px;min-height:50px;display:flex;flex-direction:column;justify-content:center;gap:2px;}
.sched-cell:hover{outline:2px solid var(--accent);} .sched-cell .st{font-weight:800;font-size:12px;}
.sched-cell.empty{color:var(--ink-soft);font-weight:700;font-size:17px;} .sched-cell.today{outline:2px solid var(--accent);}
.summary-block{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px dashed var(--border);font-size:14px;}
.summary-block.total{font-weight:800;font-size:16.5px;border-bottom:none;border-top:2px solid var(--ink);margin-top:6px;padding-top:14px;}
.pos{color:var(--success);} .neg{color:var(--danger);}
.info-box{background:var(--info-bg);color:var(--info);border-radius:10px;padding:12px 14px;font-size:12.8px;line-height:1.9;margin-bottom:14px;}
.warn-box{background:var(--warn-bg);color:#7a5c0a;border-radius:10px;padding:12px 14px;font-size:12.8px;line-height:1.9;margin-bottom:14px;}
@media(max-width:980px){
  .sidebar{transform:translateX(100%);box-shadow:-10px 0 30px rgba(0,0,0,.3);} .sidebar.open{transform:translateX(0);}
  .main{margin-right:0;} .hamburger{display:inline-flex;align-items:center;justify-content:center;}
  .content{padding:16px 12px 50px;} .topbar{padding:11px 12px;} .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(145px,1fr));}
  .notif-panel{left:8px;right:8px;width:auto;}
}
@media print{ .sidebar,.topbar,.hamburger,.no-print{display:none !important;} .main{margin:0;} .content{padding:0;} body{background:#fff;} }
</style>
</head>
<body>
<div id="app"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#1C1613;color:#EFE6D8;font-family:'Cairo',sans-serif;font-weight:700;">جارٍ التحميل...</div></div>
<div id="modal-backdrop" class="modal-backdrop hidden">
  <div class="modal"><div class="modal-header"><h3 id="modal-title"></h3><button class="modal-close" onclick="closeModal()">×</button></div><div class="modal-body" id="modal-body"></div></div>
</div>
<div id="toast-wrap" class="toast-wrap"></div>

<script>
/* ============================================================
   H-HR — نظام موارد بشرية 
   Auth (PBKDF2 hashed), branches/RBAC, geofenced attendance with
   device-binding, single-session enforcement, in-app notifications,
   security alerts, audit log, leave management, auto payroll close.
   Persisted via window.storage (shared). See in-app Settings notes
   about the realistic security model of a browser-based system.
   ============================================================ */

const STORAGE_KEY = 'hhr_db_v2';
let DB=null, currentUser=null, view='dashboard';
let scheduleWeekStart=null, myScheduleWeekStart=null, payrollMonth=null;
let attMonth=null, salaryMonth=null, summaryMonth=null, empAttMonth=null;
let txFilters={employee:'all',month:null,type:'all'};
let taskFilters={employee:'all',status:'all'};
let discFilters={employee:'all'};
let attFilters={employee:'all',month:null};
let leaveFilters={employee:'all',status:'all'};
let activeBranchFilter=null; // super_admin only, null = all branches
let pollTimer=null;
let lastNotifCount=0, lastAlertCount=0;
let notifPanelOpen=false, alertPanelOpen=false;

/* ---------------- utils ---------------- */
function pad(n){ return n<10?'0'+n:''+n; }
function todayISO(){ const d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function nowHM(){ const d=new Date(); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function isoFromDate(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function addDays(dateStr,n){ const d=new Date(dateStr+'T00:00:00'); d.setDate(d.getDate()+n); return isoFromDate(d); }
function uid(){ return (window.crypto&&crypto.randomUUID)?crypto.randomUUID():'id-'+Date.now()+'-'+Math.random().toString(36).slice(2); }
function esc(s){ if(s===undefined||s===null) return ''; return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ n=Number(n)||0; return n.toLocaleString('en-US',{maximumFractionDigits:0})+' ج.م'; }
const WEEKDAYS_AR=['السبت','الأحد','الاثنين','الثلاثاء','الأربعاء','الخميس','الجمعة'];
const MONTHS_AR=['يناير','فبراير','مارس','أبريل','مايو','يونيو','يوليو','أغسطس','سبتمبر','أكتوبر','نوفمبر','ديسمبر'];
function weekdayAr(dateStr){ const d=new Date(dateStr+'T00:00:00'); return WEEKDAYS_AR[(d.getDay()+1)%7]; }
function fmtDateAr(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr+'T00:00:00'); return weekdayAr(dateStr)+'، '+d.getDate()+' '+MONTHS_AR[d.getMonth()]+' '+d.getFullYear(); }
function fmtDateShort(dateStr){ if(!dateStr) return ''; const d=new Date(dateStr+'T00:00:00'); return d.getDate()+' '+MONTHS_AR[d.getMonth()]; }
function monthLabel(monthKey){ if(!monthKey) return ''; const [y,m]=monthKey.split('-'); return MONTHS_AR[parseInt(m,10)-1]+' '+y; }
function currentMonthKey(){ return todayISO().slice(0,7); }
function prevMonthKey(monthKey){ const [y,m]=monthKey.split('-').map(Number); const d=new Date(y,m-2,1); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function getWeekStart(dateStr){ const d=new Date(dateStr+'T00:00:00'); const offset=(d.getDay()+1)%7; d.setDate(d.getDate()-offset); return isoFromDate(d); }
function haversine(lat1,lon1,lat2,lon2){ const R=6371000,toRad=x=>x*Math.PI/180; const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1); const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2; return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a)); }
function hourlyRate(emp){ return (Number(emp.monthlySalary)||0)/30/8; }
function timeToMinutes(t){ if(!t) return null; const [h,m]=t.split(':').map(Number); return h*60+m; }
function hoursBetween(inT,outT){ const a=timeToMinutes(inT),b=timeToMinutes(outT); if(a===null||b===null) return 0; let diff=b-a; if(diff<0) diff+=24*60; return Math.round((diff/60)*100)/100; }
function timeAgo(iso){ const diff=Date.now()-new Date(iso).getTime(); const m=Math.floor(diff/60000); if(m<1) return 'الآن'; if(m<60) return 'منذ '+m+' د'; const h=Math.floor(m/60); if(h<24) return 'منذ '+h+' س'; return 'منذ '+Math.floor(h/24)+' يوم'; }

/* ---------------- crypto: password hashing (PBKDF2-SHA256, salted) ---------------- */
function bytesToHex(bytes){ return Array.from(bytes).map(b=>b.toString(16).padStart(2,'0')).join(''); }
function hexToBytes(hex){ const arr=new Uint8Array(hex.length/2); for(let i=0;i<arr.length;i++) arr[i]=parseInt(hex.substr(i*2,2),16); return arr; }
function randomSaltHex(){ const arr=new Uint8Array(16); crypto.getRandomValues(arr); return bytesToHex(arr); }
async function hashPassword(password,saltHex){
  const enc=new TextEncoder();
  const keyMaterial=await crypto.subtle.importKey('raw',enc.encode(password),{name:'PBKDF2'},false,['deriveBits']);
  const bits=await crypto.subtle.deriveBits({name:'PBKDF2',salt:hexToBytes(saltHex),iterations:100000,hash:'SHA-256'},keyMaterial,256);
  return bytesToHex(new Uint8Array(bits));
}
async function makeCredential(plainPassword){ const salt=randomSaltHex(); const passwordHash=await hashPassword(plainPassword,salt); return {salt,passwordHash}; }

/* ---------------- device signature (best-effort, browser-based) ---------------- */
function deviceSignature(){
  const ua=navigator.userAgent||'', plat=navigator.platform||'';
  const scr=screen.width+'x'+screen.height+'x'+(window.devicePixelRatio||1);
  const lang=navigator.language||'', tz=(Intl.DateTimeFormat().resolvedOptions().timeZone)||'';
  const raw=ua+'|'+plat+'|'+scr+'|'+lang+'|'+tz;
  let h=0; for(let i=0;i<raw.length;i++){ h=(h*31+raw.charCodeAt(i))|0; }
  return 'dev_'+Math.abs(h).toString(36)+'_'+scr;
}

async function api(url, options = {}) {
  const response = await fetch(url, {
    headers: {
      'Content-Type': 'application/json',
      ...(options.headers || {})
    },
    ...options
  });

  const data = await response.json();

  if (!response.ok || data.success === false) {
    throw new Error(data.error || data.message || 'حدث خطأ في الاتصال بالخادم');
  }

  return data;
}

async function boot(){

  try {

    console.log("🔄 Loading H-HR database from server...");

    const response = await fetch("/api/db", {
      method: "GET",
      headers: {
        "Accept": "application/json"
      },
      cache: "no-store"
    });

    if (!response.ok) {
      throw new Error(
        `Server returned HTTP ${response.status}`
      );
    }

    const result = await response.json();

    if (!result.success || !result.db) {
      throw new Error(
        result.error || "Invalid database response"
      );
    }

    DB = result.db;

    console.log("✅ Database loaded from PostgreSQL");

  } catch (error) {

    console.error(
      "❌ Failed to load database from server:",
      error
    );

    DB = null;

    toast(
      "تعذر الاتصال بالخادم وقاعدة البيانات",
      "error"
    );

    return;
  }

  // =========================================
  // ENSURE ARRAYS EXIST
  // =========================================

  DB.branches = DB.branches || [];

  DB.employees = DB.employees || [];

  DB.attendance = DB.attendance || [];

  DB.schedules = DB.schedules || [];

  DB.tasks = DB.tasks || [];

  DB.transactions = DB.transactions || [];

  DB.disciplinary = DB.disciplinary || [];

  DB.payrollClosings =
    DB.payrollClosings || [];

  DB.leaveRequests =
    DB.leaveRequests || [];

  DB.notifications =
    DB.notifications || [];

  DB.securityAlerts =
    DB.securityAlerts || [];

  DB.auditLog =
    DB.auditLog || [];

  DB.settings = Object.assign(
    defaultSettings(),
    DB.settings || {}
  );

  // =========================================
  // RENDER APPLICATION
  // =========================================

  render();
}
async function persist(){

  try {

    const response = await fetch("/api/db", {

      method: "PUT",

      headers: {
        "Content-Type": "application/json",
        "Accept": "application/json"
      },

      body: JSON.stringify(DB)

    });

    const result = await response.json();

    if (!response.ok || !result.success) {

      throw new Error(
        result.error ||
        `Server returned HTTP ${response.status}`
      );

    }

    console.log(
      "✅ Database saved to PostgreSQL"
    );

    return true;

  } catch (error) {

    console.error(
      "❌ Database save error:",
      error
    );

    toast(
      "حدث خطأ أثناء حفظ البيانات: " +
      error.message,
      "error"
    );

    return false;
  }
}
async function silentReload(){

  try {

    const response = await fetch("/api/db", {

      method: "GET",

      headers: {
        "Accept": "application/json"
      },

      cache: "no-store"

    });

    if (!response.ok) {

      throw new Error(
        `Server returned HTTP ${response.status}`
      );

    }

    const result = await response.json();

    if (!result.success || !result.db) {

      throw new Error(
        result.error ||
        "Invalid database response"
      );

    }

    DB = result.db;

    console.log(
      "✅ Database reloaded from PostgreSQL"
    );

    return true;

  } catch (error) {

    console.error(
      "❌ Reload error:",
      error
    );

    return false;
  }
}
async function reloadDB() {
  const ok = await silentReload();

  if (ok) {
    toast('تم تحديث البيانات من الخادم', 'success');
    render();
  } else {
    toast('تعذر تحديث البيانات من الخادم', 'error');
  }
}

function logAudit(action,detail){ DB.auditLog.unshift({ id:uid(), actorId:currentUser?currentUser.id:null, actorName:currentUser?currentUser.name:'نظام', action, detail, createdAt:new Date().toISOString() }); if(DB.auditLog.length>500) DB.auditLog.length=500; }
function pushNotification(employeeId,title,body,type){ DB.notifications.unshift({ id:uid(), employeeId, title, body, type, createdAt:new Date().toISOString(), read:false }); if(DB.notifications.length>1000) DB.notifications.length=1000; }
function pushSecurityAlert(type,{employeeId=null,username=null,branchId=null,detail='',severity='medium'}={}){
  DB.securityAlerts.unshift({ id:uid(), type, employeeId, username, branchId, detail, severity, createdAt:new Date().toISOString(), acknowledged:false });
  if(DB.securityAlerts.length>500) DB.securityAlerts.length=500;
}

/* ---------------- auth ---------------- */
function isAdminRole(role){ return role==='super_admin'||role==='branch_admin'; }
async function doLogin(){
  const username=document.getElementById('login-user').value.trim();
  const password=document.getElementById('login-pass').value;
  const errEl=document.getElementById('login-error'); errEl.textContent='';
  await silentReload();
  const emp=DB.employees.find(e=>e.username===username);
  if(!emp || emp.active===false){ errEl.textContent='اسم المستخدم أو كلمة المرور غير صحيحة'; pushSecurityAlert('failed_login',{username,detail:'محاولة دخول باسم مستخدم غير موجود أو معطل'}); await persist(); return; }
  if(emp.lockedUntil && Date.now()<emp.lockedUntil){
    const mins=Math.ceil((emp.lockedUntil-Date.now())/60000);
    errEl.textContent='الحساب مقفول مؤقتًا بسبب محاولات دخول فاشلة متكررة، حاول بعد '+mins+' دقيقة';
    return;
  }
  const hash=await hashPassword(password,emp.salt);
  if(hash!==emp.passwordHash){
    emp.failedAttempts=(emp.failedAttempts||0)+1;
    if(emp.failedAttempts>=5){ emp.lockedUntil=Date.now()+15*60*1000; emp.failedAttempts=0; pushSecurityAlert('account_locked',{employeeId:emp.id,username:emp.username,branchId:emp.branchId,detail:'تم قفل الحساب مؤقتًا بعد 5 محاولات دخول فاشلة',severity:'high'}); }
    else{ pushSecurityAlert('failed_login',{employeeId:emp.id,username:emp.username,branchId:emp.branchId,detail:'كلمة مرور خاطئة (محاولة '+emp.failedAttempts+'/5)'}); }
    await persist();
    errEl.textContent='اسم المستخدم أو كلمة المرور غير صحيحة';
    return;
  }
  // success
  const hadActiveSession = !!emp.activeSessionToken && emp.activeSessionAt && (Date.now()-emp.activeSessionAt < 12*60*60*1000);
  emp.failedAttempts=0; emp.lockedUntil=null;
  const token=uid();
  emp.activeSessionToken=token; emp.activeSessionAt=Date.now(); emp.activeLoginDeviceSig=deviceSignature();
  if(hadActiveSession){ pushSecurityAlert('session_takeover',{employeeId:emp.id,username:emp.username,branchId:emp.branchId,detail:'تم تسجيل دخول جديد بينما كانت هناك جلسة نشطة بالفعل — سيتم إنهاء الجلسة القديمة تلقائيًا',severity:'medium'}); }
  logAudit('تسجيل دخول','دخل '+emp.name+' ('+emp.username+')');
  await persist();
  currentUser=Object.assign({},emp,{sessionToken:token});
  view = isAdminRole(emp.role) ? 'dashboard' : 'emp-dashboard';
  lastNotifCount=DB.notifications.filter(n=>n.employeeId===emp.id).length;
  lastAlertCount=DB.securityAlerts.filter(a=>!a.acknowledged).length;
  if(isAdminRole(emp.role)) await autoClosePendingPayrolls();
  render();
}
async function logout(){
  if(currentUser){
    const emp=DB.employees.find(e=>e.id===currentUser.id);
    if(emp){ emp.activeSessionToken=null; logAudit('تسجيل خروج',emp.name); await persist(); }
  }
  currentUser=null; stopPolling(); render();
}

/* ---------------- polling: session validity + notifications ---------------- */
function startPolling(){
  stopPolling();
  pollTimer=setInterval(async ()=>{
    if(!currentUser) return;
    const ok=await silentReload(); if(!ok) return;
    const emp=DB.employees.find(e=>e.id===currentUser.id);
    if(!emp || emp.active===false){ toast('تم إلغاء تفعيل حسابك','error'); currentUser=null; stopPolling(); render(); return; }
    if(emp.activeSessionToken!==currentUser.sessionToken){
      toast('تم تسجيل الدخول لحسابك من جهاز آخر، تم إنهاء هذه الجلسة','error');
      currentUser=null; stopPolling(); render(); return;
    }
    // notifications for employee
    const myNotifs=DB.notifications.filter(n=>n.employeeId===currentUser.id);
    if(myNotifs.length>lastNotifCount){
      const fresh=myNotifs.slice(0,myNotifs.length-lastNotifCount);
      fireBrowserNotifications(fresh);
    }
    lastNotifCount=myNotifs.length;
    // security alerts for admins
    if(isAdminRole(currentUser.role)){
      const scoped = currentUser.role==='super_admin' ? DB.securityAlerts : DB.securityAlerts.filter(a=>a.branchId===currentUser.branchId||a.employeeId===currentUser.id);
      const unresolved=scoped.filter(a=>!a.acknowledged);
      if(unresolved.length>lastAlertCount){ fireBrowserNotifications(unresolved.slice(0,unresolved.length-lastAlertCount).map(a=>({title:'⚠️ تنبيه أمني',body:a.detail}))); }
      lastAlertCount=unresolved.length;
    }
    updateBellBadges();
  },60000);
}
function stopPolling(){ if(pollTimer){ clearInterval(pollTimer); pollTimer=null; } }
function fireBrowserNotifications(items){
  if(!('Notification' in window) || Notification.permission!=='granted') return;
  items.slice(0,3).forEach(n=>{ try{ new Notification(n.title,{ body:n.body, tag:'hhr-'+Date.now()+Math.random() }); }catch(e){} });
}
function requestNotifPermission(){
  if(!('Notification' in window)){ toast('المتصفح لا يدعم الإشعارات الفورية','error'); return; }
  Notification.requestPermission().then(p=>{ if(p==='granted') toast('تم تفعيل الإشعارات الفورية','success'); render(); });
}
function updateBellBadges(){
  const nb=document.getElementById('notif-badge'); const ab=document.getElementById('alert-badge');
  if(nb){ const c=DB.notifications.filter(n=>n.employeeId===currentUser.id && !n.read).length; nb.textContent=c>9?'9+':c; nb.classList.toggle('hidden',c===0); }
  if(ab){ const scoped=currentUser.role==='super_admin'?DB.securityAlerts:DB.securityAlerts.filter(a=>a.branchId===currentUser.branchId); const c=scoped.filter(a=>!a.acknowledged).length; ab.textContent=c>9?'9+':c; ab.classList.toggle('hidden',c===0); }
}

/* ============================================================
   PAYROLL CALC (shared)
   ============================================================ */
function computeEmployeeMonth(employeeId,month){
  const emp=DB.employees.find(e=>e.id===employeeId)||{};
  const base=Number(emp.monthlySalary)||0;
  const txs=DB.transactions.filter(t=>t.employeeId===employeeId && t.date && t.date.slice(0,7)===month && t.status==='موافق عليه');
  const overtime=txs.filter(t=>t.type==='إضافي').reduce((s,t)=>s+Number(t.amount||0),0);
  const advances=txs.filter(t=>t.type==='سلفة').reduce((s,t)=>s+Number(t.amount||0),0);
  const deductions=txs.filter(t=>t.type==='خصم').reduce((s,t)=>s+Number(t.amount||0),0);
  const penalties=DB.disciplinary.filter(d=>d.employeeId===employeeId && d.date && d.date.slice(0,7)===month).reduce((s,d)=>s+Number(d.penaltyAmount||0),0);
  const net=base+overtime-advances-deductions-penalties;
  const closing=DB.payrollClosings.find(p=>p.employeeId===employeeId && p.month===month);
  return { employeeId, name:emp.name||'', base, overtime, advances, deductions, penalties, net, closed:!!closing, closing };
}
function isOnApprovedLeave(employeeId,dateStr){ return DB.leaveRequests.some(l=>l.employeeId===employeeId && l.status==='موافق عليها' && dateStr>=l.fromDate && dateStr<=l.toDate); }
function suggestOvertimeHours(employeeId,month){
  const atts=DB.attendance.filter(a=>a.employeeId===employeeId && a.date.slice(0,7)===month && a.clockIn && a.clockOut);
  const actual=atts.reduce((s,a)=>s+hoursBetween(a.clockIn,a.clockOut),0);
  const scheds=DB.schedules.filter(s=>s.employeeId===employeeId && s.date.slice(0,7)===month && s.shiftStart && s.shiftEnd);
  const planned=scheds.reduce((s,sh)=>s+hoursBetween(sh.shiftStart,sh.shiftEnd),0);
  return Math.max(0,Math.round((actual-planned)*100)/100);
}
function absentDaysInMonth(employeeId,month){
  const [y,m]=month.split('-').map(Number); const daysInMonth=new Date(y,m,0).getDate();
  const out=[];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=month+'-'+pad(d); if(dateStr>=todayISO()) break;
    const sh=DB.schedules.find(s=>s.employeeId===employeeId && s.date===dateStr);
    if(!sh) continue;
    const att=DB.attendance.find(a=>a.employeeId===employeeId && a.date===dateStr && a.clockIn);
    if(att) continue;
    if(isOnApprovedLeave(employeeId,dateStr)) continue;
    out.push(dateStr);
  }
  return out;
}
async function generateAutoAbsenceDeductions(employeeId,month){
  const emp=DB.employees.find(e=>e.id===employeeId); if(!emp) return;
  const absences=absentDaysInMonth(employeeId,month);
  const allowed=DB.settings.allowedUnpaidAbsences||0;
  const excess=absences.slice(allowed);
  const dailyRate=Math.round((Number(emp.monthlySalary)||0)/30);
  excess.forEach(dateStr=>{
    const already=DB.transactions.find(t=>t.employeeId===employeeId && t.isAuto && t.autoRef==='absence:'+dateStr);
    if(already) return;
    DB.transactions.push({ id:uid(), employeeId, type:'خصم', amount:dailyRate, date:dateStr, reason:'خصم غياب تلقائي بدون بصمة أو إجازة معتمدة', status:'موافق عليه', month, isAuto:true, autoRef:'absence:'+dateStr });
  });
}
async function autoClosePendingPayrolls(){
  const day=DB.settings.payrollAutoCloseDay||3;
  if(new Date().getDate()<day) return;
  const monthToClose=prevMonthKey(currentMonthKey());
  const staff=DB.employees.filter(e=>e.role==='employee' && e.active!==false);
  let closedAny=false;
  for(const e of staff){
    const existing=DB.payrollClosings.find(p=>p.employeeId===e.id && p.month===monthToClose);
    if(existing) continue;
    await generateAutoAbsenceDeductions(e.id,monthToClose);
    const c=computeEmployeeMonth(e.id,monthToClose);
    DB.payrollClosings.push({ id:uid(), employeeId:e.id, month:monthToClose, baseSalary:c.base, overtimeTotal:c.overtime, advancesTotal:c.advances, deductionsTotal:c.deductions, penaltiesTotal:c.penalties, netPay:c.net, closedAt:new Date().toISOString(), closedBy:'تقفيل تلقائي', status:'مقفول', auto:true });
    pushNotification(e.id,'تم قفل راتبك تلقائيًا','راتب '+monthLabel(monthToClose)+' — الصافي: '+fmtMoney(c.net),'payroll');
    logAudit('تقفيل تلقائي للمرتب','قُفل راتب '+e.name+' لشهر '+monthLabel(monthToClose)+' تلقائيًا');
    closedAny=true;
  }
  if(closedAny) await persist();
}

async function saveEmployee(id){
  const name=document.getElementById('ef-name').value.trim();
  const username=document.getElementById('ef-user').value.trim();
  const pass=document.getElementById('ef-pass').value;
  const role = currentUser.role==='super_admin' ? document.getElementById('ef-role').value : 'employee';
  const branchId = currentUser.role==='super_admin' ? document.getElementById('ef-branch').value : currentUser.branchId;
  const salary=Number(document.getElementById('ef-salary').value)||0;
  const annualLeaveBalance=Number(document.getElementById('ef-leave').value)||0;
  const pos=document.getElementById('ef-pos').value.trim();
  const phone=document.getElementById('ef-phone').value.trim();
  const hire=document.getElementById('ef-hire').value||todayISO();
  if(!name||!username){ toast('الاسم واسم المستخدم مطلوبان','error'); return; }
  const dup=DB.employees.find(e=>e.username===username && e.id!==id);
  if(dup){ toast('اسم المستخدم مستخدم بالفعل','error'); return; }
  if(id){
    const e=DB.employees.find(x=>x.id===id);
    if(!canManage(e)){ toast('لا تملك صلاحية','error'); return; }
    Object.assign(e,{name,username,role,branchId:role==='super_admin'?null:branchId,monthlySalary:salary,position:pos,phone,hireDate:hire,annualLeaveBalance});
    if(pass){ const cred=await makeCredential(pass); e.salt=cred.salt; e.passwordHash=cred.passwordHash; }
    logAudit('تعديل موظف',name);
  }else{
    if(!pass){ toast('كلمة المرور مطلوبة للموظف الجديد','error'); return; }
    const cred=await makeCredential(pass);
    DB.employees.push({ id:uid(), username, salt:cred.salt, passwordHash:cred.passwordHash, name, role, branchId:role==='super_admin'?null:branchId, position:pos, phone, monthlySalary:salary, hireDate:hire, active:true, annualLeaveBalance, registeredDevice:null, activeSessionToken:null, activeSessionAt:null, failedAttempts:0, lockedUntil:null });
    logAudit('إضافة موظف',name);
  }
  await persist(); closeModal(); render(); toast('تم الحفظ','success');
}
async function toggleEmployeeActive(id){
  const e=DB.employees.find(x=>x.id===id); if(!e||!canManage(e)) return;
  e.active = e.active===false?true:false;
  if(e.active===false) e.activeSessionToken=null;
  logAudit(e.active===false?'تعطيل موظف':'تفعيل موظف',e.name);
  await persist(); render();
}
async function resetDevice(id){
  const e=DB.employees.find(x=>x.id===id); if(!e||!canManage(e)) return;
  if(!confirm('إعادة تعيين الجهاز المعتمد لـ '+e.name+'؟ سيتم قبول أول جهاز يستخدمه بعد ذلك كجهازه الجديد.')) return;
  e.registeredDevice=null; logAudit('إعادة تعيين جهاز',e.name); await persist(); render(); toast('تم إعادة التعيين','success');
}

function renderSchedulesAdmin(){

  const emps=scopedActiveStaff(); const today=todayISO();
  const rows=emps.map(e=>{
    const cells=days.map(d=>{
      const sh=DB.schedules.find(s=>s.employeeId===e.id && s.date===d);
      const cls='sched-cell'+(d===today?' today':'')+(sh?'':' empty');
      const inner=sh?`<span class="st">${esc(sh.shiftType||'')}</span><span>${sh.shiftStart||''}${sh.shiftEnd?'-'+sh.shiftEnd:''}</span>`:'+';
      return `<td><div class="${cls}" onclick="openShiftForm('${e.id}','${d}')">${inner}</div></td>`;
    }).join('');
    return `<tr><td style="text-align:right;font-weight:700;white-space:nowrap;">${esc(e.name)}</td>${cells}</tr>`;
  }).join('');

}
function openShiftForm(employeeId,date){

  const e=DB.employees.find(x=>x.id===employeeId);
  openModal(`شيفت ${e?e.name:''} — ${fmtDateAr(date)}`, `

async function saveShift(employeeId,date){
  const shiftStart=document.getElementById('sf-start').value, shiftEnd=document.getElementById('sf-end').value, shiftType=document.getElementById('sf-type').value, notes=document.getElementById('sf-notes').value.trim();
  let sh=DB.schedules.find(s=>s.employeeId===employeeId && s.date===date);
  if(sh) Object.assign(sh,{shiftStart,shiftEnd,shiftType,notes}); else{ sh={ id:uid(), employeeId, date, shiftStart, shiftEnd, shiftType, notes }; DB.schedules.push(sh); }
  pushNotification(employeeId,'تحديث في جدولك','تم تحديد شيفت '+fmtDateAr(date)+': '+shiftType+(shiftStart?' '+shiftStart+(shiftEnd?'-'+shiftEnd:''):''),'schedule');
  logAudit('تعديل شيفت',(DB.employees.find(e=>e.id===employeeId)||{}).name+' — '+date);
  await persist(); closeModal(); render();
}
async function deleteShift(id){ DB.schedules=DB.schedules.filter(s=>s.id!==id); await persist(); closeModal(); render(); }
async function copyPrevWeek(){
  const prevStart=addDays(scheduleWeekStart,-7); const prevDays=[...Array(7)].map((_,i)=>addDays(prevStart,i)); let count=0;
  prevDays.forEach((pd,i)=>{ const nd=addDays(scheduleWeekStart,i);
    DB.schedules.filter(s=>s.date===pd).forEach(s=>{ if(!DB.schedules.find(x=>x.employeeId===s.employeeId && x.date===nd)){ DB.schedules.push({ id:uid(), employeeId:s.employeeId, date:nd, shiftStart:s.shiftStart, shiftEnd:s.shiftEnd, shiftType:s.shiftType, notes:s.notes }); count++; } });
  });
  await persist(); render(); toast('تم نسخ '+count+' شيفت','success');
}

async function saveTask(){

  await persist(); closeModal(); render(); toast('تم إضافة المهمة','success');

  if(leaveFilters.employee!=='all') list=list.filter(l=>l.employeeId===leaveFilters.employee);
  if(leaveFilters.status!=='all') list=list.filter(l=>l.status===leaveFilters.status);
  list.sort((a,b)=>b.requestedAt.localeCompare(a.requestedAt));
  const statusBadge=s=>s==='موافق عليها'?'badge-success':s==='مرفوضة'?'badge-danger':'badge-warn';
  const rows=list.map(l=>{ const e=DB.employees.find(x=>x.id===l.employeeId);
    return `<tr><td>${esc(e?e.name:'')}</td><td class="num">${fmtDateShort(l.fromDate)} — ${fmtDateShort(l.toDate)}</td><td class="num">${l.days}</td><td>${esc(l.reason||'')}</td><td><span class="badge ${statusBadge(l.status)}">${esc(l.status)}</span></td>
      <td class="icon-btn-row">${l.status==='معلقة'?`<button class="btn btn-success btn-sm" onclick="decideLeave('${l.id}','موافق عليها')">قبول</button><button class="btn btn-danger btn-sm" onclick="decideLeave('${l.id}','مرفوضة')">رفض</button>`:''}</td></tr>`;
  }).join('');
  return `
  <div class="page-header"><div><h2>الإجازات</h2><p>طلبات إجازات الموظفين وأرصدتهم السنوية</p></div></div>

    <select onchange="leaveFilters.employee=this.value;mountView()"><option value="all">كل الموظفين</option>${emps.map(e=>`<option value="${e.id}" ${leaveFilters.employee===e.id?'selected':''}>${esc(e.name)}</option>`).join('')}</select>
    <select onchange="leaveFilters.status=this.value;mountView()"><option value="all">كل الحالات</option><option ${leaveFilters.status==='معلقة'?'selected':''}>معلقة</option><option ${leaveFilters.status==='موافق عليها'?'selected':''}>موافق عليها</option><option ${leaveFilters.status==='مرفوضة'?'selected':''}>مرفوضة</option></select>
  </div></div>

}
async function decideLeave(id,status){
  const l=DB.leaveRequests.find(x=>x.id===id); if(!l) return;
  const e=DB.employees.find(x=>x.id===l.employeeId);
  if(currentUser.role==='branch_admin' && e && e.branchId!==currentUser.branchId){ toast('لا تملك صلاحية','error'); return; }
  l.status=status; l.decidedBy=currentUser.name; l.decidedAt=new Date().toISOString();
  if(status==='موافق عليها' && e){ e.annualLeaveBalance=Math.max(0,(e.annualLeaveBalance||0)-l.days); }
  pushNotification(l.employeeId, status==='موافق عليها'?'تمت الموافقة على إجازتك':'تم رفض طلب إجازتك', fmtDateShort(l.fromDate)+' — '+fmtDateShort(l.toDate),'leave');
  logAudit('قرار إجازة',(e?e.name:'')+' — '+status);
  await persist(); render(); toast('تم التحديث','success');
}

function openTxForm(){
  const emps=scopedActiveStaff();
  openModal('إضافة حركة مالية', `

    <div id="xf-ot-helper" class="hidden">
      <div class="field-row"><div class="field"><label>عدد الساعات الإضافية</label><input id="xf-hours" type="number" oninput="calcOvertimeAmount()" placeholder="0"></div><div class="field"><label style="opacity:.001">.</label><button type="button" class="btn btn-ghost btn-sm" style="width:100%;" onclick="suggestHoursFromAttendance()">اقتراح من سجل الحضور</button></div></div>
    </div>
    <div class="field-row"><div class="field"><label>المبلغ</label><input id="xf-amount" type="number" placeholder="0"></div><div class="field"><label>التاريخ</label><input id="xf-date" type="date" value="${todayISO()}"></div></div>
    <div class="field"><label>السبب / ملاحظات</label><input id="xf-reason"></div>
    <div class="modal-actions"><button class="btn btn-primary" onclick="saveTx()">حفظ</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);

function toggleOvertimeHelper(){ document.getElementById('xf-ot-helper').classList.toggle('hidden',document.getElementById('xf-type').value!=='إضافي'); }
function calcOvertimeAmount(){ const empId=document.getElementById('xf-emp').value; const e=DB.employees.find(x=>x.id===empId); const hours=Number(document.getElementById('xf-hours').value)||0; document.getElementById('xf-amount').value=Math.round(hours*hourlyRate(e)*(DB.settings.overtimeRate||1.5)); }
function updateTxRateHint(){ if(document.getElementById('xf-type').value==='إضافي') calcOvertimeAmount(); }
function suggestHoursFromAttendance(){ const empId=document.getElementById('xf-emp').value; const hrs=suggestOvertimeHours(empId,currentMonthKey()); document.getElementById('xf-hours').value=hrs; calcOvertimeAmount(); toast('تم اقتراح '+hrs+' ساعة بناءً على سجل هذا الشهر','success'); }
async function saveTx(){
  const employeeId=document.getElementById('xf-emp').value, type=document.getElementById('xf-type').value, amount=Number(document.getElementById('xf-amount').value)||0, date=document.getElementById('xf-date').value||todayISO(), reason=document.getElementById('xf-reason').value.trim();
  if(amount<=0){ toast('أدخل مبلغًا صحيحًا','error'); return; }
  DB.transactions.push({ id:uid(), employeeId, type, amount, date, reason, status:'موافق عليه', month:date.slice(0,7) });
  const e=DB.employees.find(x=>x.id===employeeId);
  pushNotification(employeeId, type==='خصم'?'تم تسجيل خصم':type==='إضافي'?'تمت إضافة وقت إضافي':'تمت إضافة سلفة', fmtMoney(amount)+(reason?' — '+reason:''),'transaction');
  logAudit('إضافة حركة مالية',(e?e.name:'')+' — '+type+' '+amount);
  await persist(); closeModal(); render(); toast('تم الحفظ','success');
}
async function deleteTx(id){ if(!confirm('حذف هذه الحركة؟')) return; DB.transactions=DB.transactions.filter(t=>t.id!==id); await persist(); render(); }

function viewPayrollDetail(employeeId){
  const c=computeEmployeeMonth(employeeId,payrollMonth);

    <div class="summary-block"><span>الراتب الأساسي</span><span class="num">${fmtMoney(c.base)}</span></div>

    <div class="summary-block"><span>إجمالي الخصومات</span><span class="num neg">-${fmtMoney(c.deductions)}</span></div>
    <div class="summary-block"><span>إجمالي الجزاءات</span><span class="num neg">-${fmtMoney(c.penalties)}</span></div>
    <div class="summary-block total"><span>الصافي</span><span class="num">${fmtMoney(c.net)}</span></div>

    ${discs.length?`<h4 style="margin:16px 0 8px;">الجزاءات</h4>`+discs.map(d=>`<div class="summary-block"><span>${esc(d.type)}</span><span class="num">${fmtMoney(d.penaltyAmount)}</span></div>`).join(''):''}
    <div class="modal-actions"><button class="btn btn-ghost" onclick="closeModal()">إغلاق</button></div>`);

async function closePayrollOne(employeeId){
  await generateAutoAbsenceDeductions(employeeId,payrollMonth);
  const c=computeEmployeeMonth(employeeId,payrollMonth);
  const existing=DB.payrollClosings.find(p=>p.employeeId===employeeId && p.month===payrollMonth);
  const rec={ id:existing?existing.id:uid(), employeeId, month:payrollMonth, baseSalary:c.base, overtimeTotal:c.overtime, advancesTotal:c.advances, deductionsTotal:c.deductions, penaltiesTotal:c.penalties, netPay:c.net, closedAt:new Date().toISOString(), closedBy:currentUser.name, status:'مقفول', auto:false };
  if(existing) Object.assign(existing,rec); else DB.payrollClosings.push(rec);
  pushNotification(employeeId,'تم قفل راتبك','راتب '+monthLabel(payrollMonth)+' — الصافي: '+fmtMoney(c.net),'payroll');
  logAudit('تقفيل راتب',c.name+' — '+monthLabel(payrollMonth));
  await persist(); render(); toast('تم تقفيل راتب '+c.name,'success');
}
async function closePayrollAll(){
  if(!confirm('تقفيل رواتب جميع الموظفين المعروضين لشهر '+monthLabel(payrollMonth)+'؟')) return;
  for(const e of scopedActiveStaff()){ await generateAutoAbsenceDeductions(e.id,payrollMonth); const c=computeEmployeeMonth(e.id,payrollMonth);
    const existing=DB.payrollClosings.find(p=>p.employeeId===e.id && p.month===payrollMonth);
    const rec={ id:existing?existing.id:uid(), employeeId:e.id, month:payrollMonth, baseSalary:c.base, overtimeTotal:c.overtime, advancesTotal:c.advances, deductionsTotal:c.deductions, penaltiesTotal:c.penalties, netPay:c.net, closedAt:new Date().toISOString(), closedBy:currentUser.name, status:'مقفول', auto:false };
    if(existing) Object.assign(existing,rec); else DB.payrollClosings.push(rec);
    pushNotification(e.id,'تم قفل راتبك','راتب '+monthLabel(payrollMonth)+' — الصافي: '+fmtMoney(c.net),'payroll');
  }
  logAudit('تقفيل جماعي للمرتبات',monthLabel(payrollMonth));
  await persist(); render(); toast('تم تقفيل الرواتب','success');
}
async function reopenPayroll(employeeId){
  if(!confirm('إعادة فتح هذا الراتب للتعديل؟')) return;
  DB.payrollClosings=DB.payrollClosings.filter(p=>!(p.employeeId===employeeId && p.month===payrollMonth));
  logAudit('إعادة فتح راتب',(DB.employees.find(e=>e.id===employeeId)||{}).name+' — '+monthLabel(payrollMonth));
  await persist(); render();
}

async function handleClock(mode){
  if(mode==='done') return;
  const btn=document.getElementById('clock-btn'), statusLine=document.getElementById('clock-status-line'), label=document.getElementById('radar-core-label');
  await silentReload();
  const emp=DB.employees.find(e=>e.id===currentUser.id);
  const today=todayISO();
  let existing=DB.attendance.find(x=>x.employeeId===currentUser.id && x.date===today);
  if(mode==='in' && existing && existing.clockIn){ toast('تم تسجيل حضورك بالفعل اليوم الساعة '+existing.clockIn,'error'); render(); return; }
  if(mode==='out' && existing && existing.clockOut){ toast('تم تسجيل انصرافك بالفعل اليوم الساعة '+existing.clockOut,'error'); render(); return; }
  const currentSig=deviceSignature();
  if(emp.registeredDevice && emp.registeredDevice.signature!==currentSig){
    btn.classList.add('blocked'); label.textContent='جهاز غير معتمد ✕';
    pushSecurityAlert('device_mismatch',{employeeId:emp.id,username:emp.username,branchId:emp.branchId,detail:'محاولة تسجيل '+(mode==='in'?'حضور':'انصراف')+' من جهاز غير مطابق للجهاز المسجَّل',severity:'high'});
    pushNotification(emp.id,'تم حظر محاولة بصمة','هذا الجهاز غير مطابق لجهازك المسجَّل. تم إبلاغ الإدارة. تواصل مع المدير إذا كان لديك جهاز جديد.','security');
    await persist();
    toast('هذا ليس جهازك المسجَّل. تم إبلاغ الإدارة.','error');
    setTimeout(()=>{ btn.classList.remove('blocked'); render(); },2500);
    return;
  }
  if(!navigator.geolocation){ await proceedClock(mode,null,currentSig); return; }
  btn.classList.add('scanning'); label.textContent='جارٍ تحديد الموقع...'; statusLine.textContent='';
  navigator.geolocation.getCurrentPosition(async pos=>{
    btn.classList.remove('scanning');
    const branch=DB.branches.find(b=>b.id===emp.branchId);
    let withinZone=null, distance=null;
    if(branch && branch.lat!=null && branch.lng!=null){
      distance=Math.round(haversine(pos.coords.latitude,pos.coords.longitude,branch.lat,branch.lng));
      withinZone=distance<=Number(branch.radius||100);
      if(!withinZone){
        const proceed=confirm('أنت على بعد '+distance+' متر من موقع العمل، خارج النطاق المسموح ('+branch.radius+' متر). هل تريد المتابعة والتسجيل على أي حال؟');
        if(!proceed){ label.textContent=mode==='in'?'تسجيل حضور':'تسجيل انصراف'; return; }
      }
    }
    await proceedClock(mode,{ lat:pos.coords.latitude, lng:pos.coords.longitude, distance, withinZone },currentSig);
  }, async err=>{
    btn.classList.remove('scanning'); label.textContent=mode==='in'?'تسجيل حضور':'تسجيل انصراف';
    toast('تعذر تحديد الموقع: '+err.message,'error');
  }, { enableHighAccuracy:true, timeout:12000 });
}
async function proceedClock(mode,loc,deviceSig){
  await silentReload();
  const emp=DB.employees.find(e=>e.id===currentUser.id);
  if(!emp.registeredDevice){ emp.registeredDevice={ signature:deviceSig, registeredAt:new Date().toISOString() }; }
  const today=todayISO();
  let a=DB.attendance.find(x=>x.employeeId===currentUser.id && x.date===today);
  if(mode==='in'){
    if(a && a.clockIn){ toast('تم تسجيل حضورك بالفعل اليوم الساعة '+a.clockIn,'error'); render(); return; }
    if(!a){ a={ id:uid(), employeeId:currentUser.id, date:today, clockIn:null, clockOut:null, clockInLoc:null, clockOutLoc:null, notes:'' }; DB.attendance.push(a); }
    a.clockIn=nowHM(); a.clockInLoc=loc; a.deviceSig=deviceSig;
    toast('تم تسجيل الحضور الساعة '+a.clockIn,'success');
  }else if(mode==='out'){
    if(!a || !a.clockIn){ toast('لم يتم تسجيل حضورك اليوم بعد','error'); render(); return; }
    if(a.clockOut){ toast('تم تسجيل انصرافك بالفعل اليوم الساعة '+a.clockOut,'error'); render(); return; }
    a.clockOut=nowHM(); a.clockOutLoc=loc;
    toast('تم تسجيل الانصراف الساعة '+a.clockOut,'success');
  }
  await persist(); render();
}

  const txs=DB.transactions.filter(t=>t.employeeId===currentUser.id && t.date.slice(0,7)===salaryMonth).sort((a,b)=>b.date.localeCompare(a.date));
  return `<div class="page-header"><div><h2>راتبي</h2><p>تفاصيل الراتب الشهري والحركات المالية</p></div><button class="btn btn-primary" onclick="openRequestAdvance()">${icon('plus')} طلب سلفة</button></div>
  <div class="table-toolbar no-print"><input type="month" value="${salaryMonth}" onchange="salaryMonth=this.value;mountView()"></div>
  <div class="grid-2">
    <div class="card"><div class="section-title">ملخص ${monthLabel(salaryMonth)} ${c.closed?'<span class="badge badge-success">مقفول</span>':'<span class="badge badge-muted">مفتوح</span>'}</div>
      <div class="summary-block"><span>الراتب الأساسي</span><span class="num">${fmtMoney(c.base)}</span></div>
      <div class="summary-block"><span>الوقت الإضافي</span><span class="num pos">+${fmtMoney(c.overtime)}</span></div>
      <div class="summary-block"><span>السلف</span><span class="num neg">-${fmtMoney(c.advances)}</span></div>
      <div class="summary-block"><span>الخصومات</span><span class="num neg">-${fmtMoney(c.deductions)}</span></div>
      <div class="summary-block"><span>الجزاءات</span><span class="num neg">-${fmtMoney(c.penalties)}</span></div>
      <div class="summary-block total"><span>صافي الراتب</span><span class="num">${fmtMoney(c.net)}</span></div></div>
    <div class="card"><div class="section-title">الحركات المالية</div>
      ${txs.length?txs.map(t=>`<div class="summary-block"><span>${fmtDateShort(t.date)} · ${esc(t.type)}${t.reason?' — '+esc(t.reason):''}</span><span class="num">${fmtMoney(t.amount)} <span class="badge ${t.status==='معلق'?'badge-warn':t.status==='مرفوض'?'badge-danger':'badge-success'}" style="margin-right:6px;">${esc(t.status)}</span></span></div>`).join(''):`<div class="empty-state">لا توجد حركات هذا الشهر</div>`}</div>
  </div>`;
}
function openRequestAdvance(){
  openModal('طلب سلفة', `<div class="field"><label>المبلغ</label><input id="ra-amount" type="number" placeholder="0"></div><div class="field"><label>السبب</label><textarea id="ra-reason" rows="2"></textarea></div>
    <p style="color:var(--ink-soft);font-size:12.5px;">سيتم إرسال الطلب للمدير للموافقة قبل خصمه من الراتب.</p>
    <div class="modal-actions"><button class="btn btn-primary" onclick="submitAdvanceRequest()">إرسال الطلب</button><button class="btn btn-ghost" onclick="closeModal()">إلغاء</button></div>`);
}
async function submitAdvanceRequest(){
  const amount=Number(document.getElementById('ra-amount').value)||0, reason=document.getElementById('ra-reason').value.trim();
  if(amount<=0){ toast('أدخل مبلغًا صحيحًا','error'); return; }
  DB.transactions.push({ id:uid(), employeeId:currentUser.id, type:'سلفة', amount, date:todayISO(), reason, status:'معلق', month:currentMonthKey() });
  logAudit('طلب سلفة',currentUser.name+' — '+amount);
  await persist(); closeModal(); render(); toast('تم إرسال طلب السلفة','success');
}

function renderEmpAttendance(){
  if(!empAttMonth) empAttMonth=currentMonthKey();
  const [y,m]=empAttMonth.split('-').map(Number); const daysInMonth=new Date(y,m,0).getDate(); const grace=DB.settings.lateGraceMinutes||15;
  let present=0,lateCount=0,totalHours=0; const rows=[];
  for(let d=1; d<=daysInMonth; d++){
    const dateStr=empAttMonth+'-'+pad(d); if(dateStr>todayISO()) break;
    const a=DB.attendance.find(x=>x.employeeId===currentUser.id && x.date===dateStr);
    const sh=DB.schedules.find(s=>s.employeeId===currentUser.id && s.date===dateStr);
    let status='—', cls='badge-muted';
    if(a&&a.clockIn){ present++; let isLate=false; if(sh&&sh.shiftStart){ const start=timeToMinutes(sh.shiftStart), inT=timeToMinutes(a.clockIn); if(inT-start>grace) isLate=true; }
      if(isLate){ status='متأخر'; cls='badge-warn'; lateCount++; } else { status='حاضر'; cls='badge-success'; }
      if(a.clockOut) totalHours+=hoursBetween(a.clockIn,a.clockOut);
    } else if(isOnApprovedLeave(currentUser.id,dateStr)){ status='إجازة'; cls='badge-info'; }
    else if(sh){ status='غائب'; cls='badge-danger'; }
    rows.push(`<tr><td>${weekdayAr(dateStr)}</td><td class="num">${fmtDateShort(dateStr)}</td><td class="num">${a&&a.clockIn?a.clockIn:'—'}</td><td class="num">${a&&a.clockOut?a.clockOut:'—'}</td><td><span class="badge ${cls}">${status}</span></td></tr>`);
  }
  return `<div class="page-header"><div><h2>سجل حضوري</h2><p>مراجعة الحضور والانصراف خلال الشهر</p></div></div>
  <div class="table-toolbar"><input type="month" value="${empAttMonth}" onchange="empAttMonth=this.value;mountView()">
    <div style="flex:1;display:flex;gap:10px;"><div class="kpi-card" style="flex:1;padding:10px 14px;"><div class="kpi-label">أيام الحضور</div><div class="kpi-value" style="font-size:17px;">${present}</div></div><div class="kpi-card warn" style="flex:1;padding:10px 14px;"><div class="kpi-label">أيام التأخير</div><div class="kpi-value" style="font-size:17px;">${lateCount}</div></div><div class="kpi-card" style="flex:1;padding:10px 14px;"><div class="kpi-label">إجمالي الساعات</div><div class="kpi-value" style="font-size:17px;">${Math.round(totalHours)}</div></div></div></div>
  <div class="table-wrap"><table><thead><tr><th>اليوم</th><th>التاريخ</th><th>الحضور</th><th>الانصراف</th><th>الحالة</th></tr></thead><tbody>${rows.join('')}</tbody></table></div>`;
}

function renderEmpDisciplinary(){
  const mine=DB.disciplinary.filter(d=>d.employeeId===currentUser.id).sort((a,b)=>b.date.localeCompare(a.date));
  const rows=mine.map(d=>`<tr><td>${fmtDateShort(d.date)}</td><td>${esc(d.type)}</td><td>${esc(d.description||'')}</td><td class="num">${d.penaltyAmount?fmtMoney(d.penaltyAmount):'—'}</td></tr>`).join('');
  return `<div class="page-header"><div><h2>الجزاءات التأديبية</h2><p>سجلك الخاص بالمخالفات إن وجدت</p></div></div>
  <div class="table-wrap"><table><thead><tr><th>التاريخ</th><th>النوع</th><th>الوصف</th><th>الخصم</th></tr></thead><tbody>${rows||`<tr><td colspan="4" class="empty-state">لا توجد جزاءات مسجلة — سجل نظيف 🎉</td></tr>`}</tbody></table></div>`;
}

function renderEmpSummary(){
  if(!summaryMonth) summaryMonth=currentMonthKey();
  const c=computeEmployeeMonth(currentUser.id,summaryMonth);
  const [y,m]=summaryMonth.split('-').map(Number); const daysInMonth=new Date(y,m,0).getDate();
  let present=0,lateCount=0,absentCount=0; const grace=DB.settings.lateGraceMinutes||15;
  for(let d=1; d<=daysInMonth; d++){ const dateStr=summaryMonth+'-'+pad(d); if(dateStr>todayISO()) break;
    const a=DB.attendance.find(x=>x.employeeId===currentUser.id && x.date===dateStr); const sh=DB.schedules.find(s=>s.employeeId===currentUser.id && s.date===dateStr);
    if(a&&a.clockIn){ present++; if(sh&&sh.shiftStart){ const start=timeToMinutes(sh.shiftStart), inT=timeToMinutes(a.clockIn); if(inT-start>grace) lateCount++; } }
    else if(sh && !isOnApprovedLeave(currentUser.id,dateStr)){ absentCount++; }
  }
  const myTasksAll=DB.tasks.filter(t=>t.employeeId===currentUser.id && t.assignedDate && t.assignedDate.slice(0,7)===summaryMonth);
  const tasksDone=myTasksAll.filter(t=>t.status==='مكتملة').length;
  const discCount=DB.disciplinary.filter(d=>d.employeeId===currentUser.id && d.date.slice(0,7)===summaryMonth).length;
  return `<div class="page-header"><div><h2>مراجعة الشهر الكامل</h2><p>ملخص شامل لأدائك خلال ${monthLabel(summaryMonth)}</p></div><button class="btn btn-ghost no-print" onclick="window.print()">طباعة</button></div>
  <div class="table-toolbar no-print"><input type="month" value="${summaryMonth}" onchange="summaryMonth=this.value;mountView()"></div>
  <div class="kpi-grid">
    <div class="kpi-card success"><div class="kpi-label">أيام الحضور</div><div class="kpi-value">${present}</div></div>
    <div class="kpi-card warn"><div class="kpi-label">أيام التأخير</div><div class="kpi-value">${lateCount}</div></div>
    <div class="kpi-card danger"><div class="kpi-label">أيام الغياب</div><div class="kpi-value">${absentCount}</div></div>
    <div class="kpi-card"><div class="kpi-label">المهام المنجزة</div><div class="kpi-value">${tasksDone} <span style="font-size:12.5px;color:var(--ink-soft);">/ ${myTasksAll.length}</span></div></div>
    <div class="kpi-card ${discCount?'danger':'success'}"><div class="kpi-label">الجزاءات</div><div class="kpi-value">${discCount}</div></div>
  </div>
  <div class="card"><div class="section-title">${icon('cash')} ملخص الراتب</div>
    <div class="summary-block"><span>الراتب الأساسي</span><span class="num">${fmtMoney(c.base)}</span></div>
    <div class="summary-block"><span>الوقت الإضافي</span><span class="num pos">+${fmtMoney(c.overtime)}</span></div>
    <div class="summary-block"><span>السلف</span><span class="num neg">-${fmtMoney(c.advances)}</span></div>
    <div class="summary-block"><span>الخصومات</span><span class="num neg">-${fmtMoney(c.deductions)}</span></div>
    <div class="summary-block"><span>الجزاءات</span><span class="num neg">-${fmtMoney(c.penalties)}</span></div>
    <div class="summary-block total"><span>الصافي</span><span class="num">${fmtMoney(c.net)}</span></div></div>`;
}

/* ---------------- boot ---------------- */
boot();
</script>
</body>
</html>
